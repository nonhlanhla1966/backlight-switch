name: Build Backlight Switch APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test, sign and upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JDK (temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-29" "build-tools;30.0.2" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          node --version
          npm --version
          javac -version
          aapt v | head -1
          ls "$ANDROID_HOME/build-tools"

      - name: Install npm dependencies (none required, kept for completeness)
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build APK
        run: npm run build

      - name: Verify APK
        run: npm run verify

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: backlight-switch-apk
          path: dist/*.apk
          if-no-files-found: error
